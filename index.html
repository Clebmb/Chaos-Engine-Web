<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/assets/chaosengine.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chaos Engine - Digital Ritual Chamber</title>
  <!-- Installable PWA: a tool you own, not a website you visit. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a0000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Chaos Engine" />
  <link rel="apple-touch-icon" href="/assets/logo.webp" />
</head>

<body>
  <div id="root"></div>
  <script>
    /* Apply the stored theme before first paint so there is never a
       flash of the default theme on reload. Mirrors lib/themes.ts. */
    (function () {
      try {
        var t = localStorage.getItem('chaos-engine-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

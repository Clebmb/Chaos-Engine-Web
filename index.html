<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/assets/chaosengine.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Engine - Digital Ritual Chamber</title>
</head>

<body>
  <div id="root"></div>
  <script>
    /* Apply the stored theme before first paint so there is never a
       flash of the default theme on reload. Mirrors lib/themes.ts. */
    (function () {
      try {
        var t = localStorage.getItem('chaos-engine-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
